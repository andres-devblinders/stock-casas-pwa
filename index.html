<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestión Casas - Almacén y Tareas</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans select-none">

  <!-- VISTA LOGIN -->
  <section id="view-login" class="min-h-screen flex items-center justify-center p-6 hidden">
    <div class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-5">
      <div class="text-center">
        <h1 class="text-xl font-bold text-indigo-400">Stock & Tareas Casas</h1>
        <p class="text-xs text-slate-400 mt-1">Conecta con tu backend de Google Sheets</p>
      </div>
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">URL WebApp (Apps Script /exec)</label>
          <input id="login-url" type="url" required placeholder="https://script.google.com/macros/s/.../exec"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Usuario</label>
          <input id="login-user" type="text" required placeholder="admin"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">PIN / Contraseña</label>
          <input id="login-pass" type="password" required placeholder="••••"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" />
        </div>
        <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800 p-2.5 rounded-lg"></div>
        <button id="btn-login-submit" type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition active:scale-95">
          Conectar y Guardar Sesión
        </button>
      </form>
    </div>
  </section>

  <!-- VISTA PRINCIPAL APP -->
  <section id="view-app" class="pb-20 hidden">
    <!-- Header -->
    <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h1 id="header-title" class="text-lg font-bold text-slate-100">Almacén</h1>
          <p id="header-user" class="text-xs text-slate-400">Usuario: -</p>
        </div>
        <div class="flex items-center gap-2">
          <!-- Botón para alternar Lista Compra dentro de Almacén -->
          <button id="btn-toggle-shopping"
            class="text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/40 px-3 py-1.5 rounded-lg font-medium active:scale-95 transition">
            🛒 Lista Compra
          </button>
          <button id="btn-logout" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
            Salir
          </button>
        </div>
      </div>

      <!-- Selector de Casas (Solo visible en modo Stock dentro de Almacén) -->
      <div id="house-selector" class="flex gap-1.5 overflow-x-auto pb-1">
        <button data-house="1" class="tab-house flex-1 py-1.5 px-3 rounded-lg text-xs font-medium bg-indigo-600 text-white whitespace-nowrap">Casa 1</button>
        <button data-house="2" class="tab-house flex-1 py-1.5 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 whitespace-nowrap">Casa 2</button>
        <button data-house="3" class="tab-house flex-1 py-1.5 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 whitespace-nowrap">Casa 3</button>
        <button data-house="4" class="tab-house flex-1 py-1.5 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 whitespace-nowrap">Casa 4</button>
      </div>
    </header>

    <!-- Contenedor dinámico -->
    <main id="content-container" class="p-4 space-y-3"></main>

    <!-- Barra de navegación inferior -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 py-2 flex justify-around">
      <button id="nav-stock" class="flex flex-col items-center flex-1 py-1 text-indigo-400 font-semibold text-xs">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span>Almacén</span>
      </button>
      <button id="nav-tasks" class="flex flex-col items-center flex-1 py-1 text-slate-400 font-semibold text-xs">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span>Tareas</span>
      </button>
    </nav>
  </section>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
